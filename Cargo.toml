[package]
name = "student-task-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework: routing + HTTP handling
axum = "0.7"

# Async runtime required by axum
tokio = { version = "1", features = ["full"] }

# Database access (SQLite) using async queries, no compile-time DB needed
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }

# Convert Rust structs <-> JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Serves the static/ folder (index.html, css, js) as a website
tower-http = { version = "0.5", features = ["fs"] }

# Used to generate a readable "created_at" timestamp for each task
chrono = { version = "0.4", features = ["serde"] }
