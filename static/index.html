<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Tracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="header">
    <h1>Student Task Tracker</h1>
    <p>Keep track of your assignments in one place.</p>
  </header>

  <main class="container">

    <section class="stats">
      <div class="stat-card">
        <span class="stat-number" id="stat-total">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-completed">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-high">0</span>
        <span class="stat-label">High Priority</span>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" id="tab-tasks">Tasks</button>
      <button class="tab" id="tab-history">History</button>
    </nav>

    <p id="message" class="message"></p>

    <!-- TASKS TAB -->
    <section id="tasks-section">
      <section class="controls">
        <input type="text" id="search-input" placeholder="Search by title or subject...">
        <select id="status-filter">
          <option value="All">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="priority-filter">
          <option value="All">All Priority</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
        <button id="add-task-btn" class="btn btn-primary">+ Add Task</button>
      </section>

      <section class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Task</th>
              <th>Subject</th>
              <th>Priority</th>
              <th>Due</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-list"></tbody>
        </table>
        <p id="empty-message" class="empty-message">No tasks found.</p>
      </section>
    </section>

    <!-- HISTORY TAB -->
    <section id="history-section" class="hidden">
      <section class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Task</th>
              <th>Subject</th>
              <th>Was Due</th>
              <th>Completed On</th>
            </tr>
          </thead>
          <tbody id="history-list"></tbody>
        </table>
        <p id="history-empty-message" class="empty-message">No completed tasks yet.</p>
      </section>
    </section>

  </main>

  <!-- Add Task modal -->
  <div id="add-task-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Add Task</h2>
      <form id="add-task-form">
        <label for="form-title">Title</label>
        <input type="text" id="form-title" required>

        <label for="form-description">Description</label>
        <textarea id="form-description" rows="3" required></textarea>

        <label for="form-subject">Subject</label>
        <input type="text" id="form-subject" required>

        <label for="form-priority">Priority</label>
        <select id="form-priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>

        <label for="form-due">Due Date &amp; Time</label>
        <input type="datetime-local" id="form-due" required>

        <p id="form-error" class="error hidden"></p>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <button type="button" class="btn" id="cancel-add-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Task modal -->
  <div id="view-task-modal" class="modal hidden">
    <div class="modal-content" id="view-task-content"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
